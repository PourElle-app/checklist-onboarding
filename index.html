<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Générateur de Checklist d'Onboarding Client (Freelance)</title>
<style>
:root{--ink:#17233b;--muted:#66758b;--blue:#5b5ce2;--line:#e5e9f2;}
body{margin:0;font:14px/1.5 Inter,sans-serif;color:var(--ink);background:#fff;}
.top{display:flex;justify-content:space-between;padding:15px 30px;border-bottom:1px solid var(--line);}
.brand{font-weight:850;font-size:20px;display:flex;gap:10px;align-items:center;}
.brandmark{width:32px;height:32px;border-radius:10px;background:var(--blue);color:#fff;display:grid;place-items:center;}
.container{max-width:800px;margin:30px auto;padding:20px;}
.form-group{display:grid;gap:5px;margin-bottom:15px;}
input{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font:inherit;}
.primary{background:var(--blue);color:#fff;padding:14px;border:0;border-radius:10px;font-weight:800;font-size:16px;cursor:pointer;width:100%;margin-top:20px;}
select{padding:8px;border-radius:8px;border:1px solid #ccc;margin-left:auto;}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><div class="brandmark">C</div> OnboardCheck</div>
  <select onchange="changeLang(this.value)"><option value="fr">🇫🇷 FR</option><option value="en">🇬🇧 EN</option><option value="es">🇪🇸 ES</option><option value="pt">🇧🇷 PT</option></select>
</div>
<div class="container">
  <h1 id="t_title">Créez votre Checklist Client</h1>
  <div class="form-group"><label id="t_lbl_client">Nom du Client</label><input type="text" id="clientName" value="Entreprise ABC"></div>
  <div class="form-group"><label id="t_lbl_services">Prestations vendues (séparées par des virgules)</label><input type="text" id="services" value="Création site web, Maintenance annuelle"></div>
  <button class="primary" id="btnGen" onclick="generate()">Générer la Checklist PDF</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>
const dict = {
  fr: { title: "Créez votre Checklist Client", lbl_client: "Nom du Client", lbl_services: "Prestations vendues", btn: "Générer la Checklist PDF", h1: "CHECKLIST D'ONBOARDING", h2: "Client :", h3: "Étapes à réaliser :", step1: "[ ] Envoyer le contrat signé", step2: "[ ] Créer le dossier client", step3: "[ ] Envoyer la facture d'acompte", step4: "[ ] Planifier la réunion de lancement" },
  en: { title: "Create your Client Checklist", lbl_client: "Client Name", lbl_services: "Services sold", btn: "Generate Checklist PDF", h1: "ONBOARDING CHECKLIST", h2: "Client:", h3: "Steps to complete:", step1: "[ ] Send signed contract", step2: "[ ] Create client folder", step3: "[ ] Send deposit invoice", step4: "[ ] Schedule kickoff meeting" },
  es: { title: "Crea tu Checklist de Cliente", lbl_client: "Nombre del Cliente", lbl_services: "Servicios vendidos", btn: "Generar Checklist PDF", h1: "CHECKLIST DE ONBOARDING", h2: "Cliente:", h3: "Pasos a completar:", step1: "[ ] Enviar contrato firmado", step2: "[ ] Crear carpeta de cliente", step3: "[ ] Enviar factura de depósito", step4: "[ ] Programar reunión de inicio" },
  pt: { title: "Crie sua Checklist de Cliente", lbl_client: "Nome do Cliente", lbl_services: "Serviços vendidos", btn: "Gerar Checklist PDF", h1: "CHECKLIST DE ONBOARDING", h2: "Cliente:", h3: "Etapas a serem concluídas:", step1: "[ ] Enviar contrato assinado", step2: "[ ] Criar pasta do cliente", step3: "[ ] Enviar fatura de depósito", step4: "[ ] Agendar reunião de kickoff" }
};
let currentLang = 'fr';
window.changeLang = (l) => {
  currentLang = l; const t = dict[l];
  document.getElementById('t_title').textContent = t.title;
  document.getElementById('t_lbl_client').textContent = t.lbl_client;
  document.getElementById('t_lbl_services').textContent = t.lbl_services;
  document.getElementById('btnGen').textContent = t.btn;
};
window.generate = async () => {
  const { PDFDocument, StandardFonts } = PDFLib;
  const doc = await PDFDocument.create(), font = await doc.embedFont(StandardFonts.Helvetica), bold = await doc.embedFont(StandardFonts.HelveticaBold);
  const page = doc.addPage([595, 842]), { height } = page.getSize(); let y = height - 50; const t = dict[currentLang];
  page.drawText(t.h1, { x: 50, y: y - 20, size: 18, font: bold }); y -= 50;
  page.drawText(t.h2 + " " + document.getElementById('clientName').value, { x: 50, y, size: 14, font: bold }); y -= 30;
  page.drawText("Prestations : " + document.getElementById('services').value, { x: 50, y, size: 11, font }); y -= 40;
  page.drawText(t.h3, { x: 50, y, size: 12, font: bold }); y -= 25;
  [t.step1, t.step2, t.step3, t.step4].forEach(step => { page.drawText(step, { x: 50, y, size: 11, font }); y -= 20; });
  const bytes = await doc.save(); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' })); a.download = 'Checklist_Client.pdf'; a.click();
};
changeLang('fr');
</script>
</body>
</html>
